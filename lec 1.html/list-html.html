<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Types of list in html</h1>
    <h2> unorderd list</h2>
    <ul type="square">
        <li>apple</li>
        <li>mango</li>
        <li>cherry</li>
    </ul>
    <h2> ordered list</h2>
    <ol type="I">
        <li>oreo</li>
        <li>silk</li>
        <li>dark chocolate</li>
    </ol>
    
</body>
</html>
